[package]
name = "DivinePort"
version = "1.2.0"
edition = "2021"
authors = ["ahkurdev"]
description = "Native Ahead-Of-Time (AOT) PS2 Static Recompilation Launcher with FidelityFX FSR 3.1/4, DLSS, and PCSX2 x SpartanPort Unified Architecture"
license = "MIT OR GPL-3.0-or-later"
repository = "https://github.com/ahkurdev/DivinePort"

[dependencies]
eframe = "0.29.1"
serde = { version = "1.0", features = ["derive"] }
serde_json = "1.0"
ini = "1.3"
rfd = "0.15"
gilrs = "0.10"
directories = "5.0"
image = { version = "0.25", default-features = false, features = ["png", "jpeg"] }
